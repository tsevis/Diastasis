name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      # Type checking is version-independent here, and numpy's stubs require
      # mypy to target 3.12+, so it runs once rather than across the matrix.
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Run tests
        run: pytest tests/ -q

  # THE FLOORS WERE PROSE UNTIL SOMEONE INSTALLED THEM.
  #
  # The job above resolves whatever is newest, so `numpy>=1.24` and its
  # neighbours in [project.dependencies] stated a minimum that nothing had
  # ever tried. The first attempt, 2026-09-20 on Python 3.10, passed: 170
  # passed, 1 skipped with every dependency at its floor. This job is what
  # keeps that true, so the declaration stays a claim rather than a wish.
  #
  # 3.10 only, and deliberately: several of these floors have no wheel for a
  # newer interpreter -- numpy 1.24 predates 3.12 -- so the floors are only
  # meaningful at the oldest Python `requires-python` admits.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # DERIVED from pyproject.toml, never a second hand-written list: a
      # duplicate would drift, and the drift would look like a passing job.
      # The generator refuses rather than skips -- a dependency with no floor,
      # or a floor its own specifier excludes, is an error there and not a
      # quiet omission here. See scripts/floor_constraints.py.
      - name: Derive the floor constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tomli>=2.0"
          python scripts/floor_constraints.py | tee floors.txt

      - name: Install every runtime dependency at its floor
        run: pip install -e ".[dev]" -c floors.txt

      # Printed because a constraints file that silently failed to apply is
      # the way this job would lie: it would pass while testing the newest
      # release of everything.
      - name: What actually resolved
        run: pip list

      - name: Run tests
        run: pytest tests/ -q
