name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      # Type checking is version-independent here, and numpy's stubs require
      # mypy to target 3.12+, so it runs once rather than across the matrix.
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Run tests
        run: pytest tests/ -q
