[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diastasis"
version = "0.6.0"
description = "Separate complex SVG artwork into production-ready layers via graph coloring"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charis Tsevis" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "svgpathtools>=1.7.2",
    # `!=2.1.0`, not a ceiling. Measured 2026-09-19 on this hardware, median
    # of 3, `Point.buffer(quad_segs=64)` intersection x20,000:
    #   2.0.7  40.23 us/call   2.1.0  63.52 us/call (1.58x)   2.1.2  44.87 us/call
    # 2.1.2 closes 79% of the gap, so only the one pathological release is
    # excluded. mozaix, cgmcreator, shapearator and heron carry the same line.
    "shapely>=2.0,!=2.1.0",
    "rtree>=1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "lxml>=4.9",
]

[project.optional-dependencies]
gui = [
    "Pillow>=10.0",
    "cairosvg>=2.5.2",
]
dev = [
    "pytest>=8.0",
    # ruff/mypy are enforced in CI (`ruff format --check`, `mypy`), so their
    # ranges are capped: a new minor release changing formatting or adding
    # checks would otherwise fail CI on an unrelated commit.
    "ruff>=0.15,<0.16",
    "mypy>=2.3,<3",
    # `scripts/floor_constraints.py` and its test read pyproject.toml, and
    # `tomllib` arrived in 3.11 while this project still supports 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/tsevis/Diastasis"
Changelog = "https://github.com/tsevis/Diastasis/blob/main/CHANGELOG.md"

[project.scripts]
diastasis = "diastasis.cli:main"

[tool.setuptools]
packages = ["diastasis"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ syntax, which mypy
# rejects when asked to type-check against an older target.
files = ["diastasis"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Geometry/graph dependencies ship no type information, and the gui extras
# (PIL, cairosvg) are optional and absent from a plain dev install. Neither
# is a defect here, so only the missing-stub noise is suppressed.
[[tool.mypy.overrides]]
module = [
    "PIL.*",
    "cairosvg.*",
    "lxml.*",
    "networkx.*",
    "rtree.*",
    "shapely.*",
    "svgpathtools.*",
]
ignore_missing_imports = true
